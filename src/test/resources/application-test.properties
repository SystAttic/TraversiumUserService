spring.application.name=UserService

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true

spring.flyway.enabled=false

spring.main.allow-bean-definition-overriding=true

resilience4j.circuitbreaker.instances.tripServiceGrpc.sliding-window-size=10
resilience4j.circuitbreaker.instances.tripServiceGrpc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tripServiceGrpc.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.moderationServiceGrpc.sliding-window-size=10
resilience4j.circuitbreaker.instances.moderationServiceGrpc.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.moderationServiceGrpc.wait-duration-in-open-state=10s

resilience4j.retry.instances.tripServiceGrpc.max-attempts=3
resilience4j.retry.instances.tripServiceGrpc.wait-duration=10ms
resilience4j.retry.instances.tripServiceGrpc.retry-exceptions=io.grpc.StatusRuntimeException

resilience4j.retry.instances.moderationServiceGrpc.max-attempts=3
resilience4j.retry.instances.moderationServiceGrpc.wait-duration=10ms
resilience4j.retry.instances.moderationServiceGrpc.retry-exceptions=io.grpc.StatusRuntimeException

spring.cloud.config.enabled=false
spring.cloud.bus.enabled=false